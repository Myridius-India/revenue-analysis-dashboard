name: package-native

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: App name for packaged artifacts
        required: true
        default: RevenueAnalysisDesktop

env:
  PYTHON_VERSION: '3.11'

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pyinstaller==6.8.0"

      - name: Build Windows EXE
        shell: pwsh
        run: |
          ./scripts/build_native.ps1 -Name "${{ github.event.inputs.app_name }}" -PythonExe "python"

      - name: Archive Windows build
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/${{ github.event.inputs.app_name }}/*" -DestinationPath "dist/${{ github.event.inputs.app_name }}-windows.zip" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-windows
          path: |
            dist/${{ github.event.inputs.app_name }}-windows.zip
            dist/${{ github.event.inputs.app_name }}/**

  macos-app:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pyinstaller==6.8.0"

      - name: Build macOS app bundle
        run: |
          python -m PyInstaller --noconfirm --windowed --name "${{ github.event.inputs.app_name }}" native_app/main.py

      - name: Archive macOS app
        run: |
          ditto -c -k --sequesterRsrc --keepParent "dist/${{ github.event.inputs.app_name }}.app" "dist/${{ github.event.inputs.app_name }}-macos-app.zip"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.app_name }}-macos
          path: |
            dist/${{ github.event.inputs.app_name }}-macos-app.zip
            dist/${{ github.event.inputs.app_name }}.app
